# Shared trainer and data settings. Combine with one file from configs/model/:
#   uv run bubblelat test --config configs/base.yaml --config configs/model/downsample.yaml
seed_everything: 0
trainer:
  max_epochs: 50
  accelerator: auto
  devices: 1
  precision: 32
  log_every_n_steps: 20
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        save_last: true       # scripts/common.sh tests and resumes from last.ckpt
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: bubblelat
      save_dir: outputs
data:
  data_dirs: [data/samples]           # cache root; build: python -m bubblelat.cache hdf5 ../BubbleGen/samples --out data/samples
                                      # on HPC3, scripts/common.sh points this at the staged 128x128 cache
  holdout_every: 5                    # per directory, by wall temp: i%5==1 val, i%5==3 test
  fields: [dfun, temperature, velx, vely]
  burn_in: 0                          # 100 for full BubbleML runs
  batch_size: 16
  num_workers: 4
