# ConvAE backbone with a Gaussian latent and a beta-weighted KL term (see losses.BetaVAE for units).
model:
  model:
    class_path: bubblelat.models.ConvVAE
    init_args:
      in_channels: 4
      channels: [32, 64, 128]
      latent_channels: 4
  loss:
    class_path: bubblelat.losses.BetaVAE
    init_args:
      beta: 0.01
  lr: 1.0e-3
