# ViT autoencoder. patch_size 8 with 4 latent channels gives the (4, 16, 16) latent of the 3-level
# ConvAE, 64x compression. Width and heads are ViT-Tiny's.
model:
  model:
    class_path: bubblelat.models.ViTAE
    init_args:
      in_channels: 4
      patch_size: 8
      latent_channels: 4
      dim: 192
      depth: 4
      heads: 3
  loss:
    class_path: bubblelat.losses.MSE
  lr: 1.0e-3
