[project]
name = "bubblelat"
version = "0.0.0"
description = "Evaluation of latent representation over BubbleML"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "h5py>=3.16.0",
    "jsonargparse[signatures]>=4.27",
    "jupyter>=1.1.1",
    "lightning>=2.6.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "timm>=1.0.30",
    "torch>=2.14.1,<2.15",
    "torchvision",
    "wandb>=0.31.0",
]

[project.scripts]
bubblelat = "bubblelat.cli:main"

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.3",
    "ty>=0.0.96",
]

[tool.ruff]
line-length = 100

# HPC3 drivers (580.x) support CUDA <= 13.0, so take torch from the cu130 index, not PyPI (cu132).
[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
